name: ci

# Lint and types once, and the test suite on every supported Python, on every push and pull
# request. SQLMesh is installed normally (not editable), so mypy sees its type hints, which an
# editable local checkout hides. Sign-off on pull requests is checked by the DCO GitHub App.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The execution-observation API is not in a SQLMesh release yet; pin a tested main commit
  # (the same one the docs and release workflows use). nightly.yml tests SQLMesh main HEAD.
  SQLMESH_REF: 3df452cc9f47a435439cda087c3a419a1778b2b9
  SQLMESH__DISABLE_ANONYMIZED_ANALYTICS: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from git history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sqlmesh @ git+https://github.com/SQLMesh/sqlmesh@${SQLMESH_REF}"
          python -m pip install -e ".[dev]"

      - name: Guard rails
        run: |
          ! grep -rn "set_console" src/ || { echo "src/ must not call set_console"; exit 1; }
          ! grep -rn "sqlmesh.materializations" src/ || { echo "src/ must not patch materializations"; exit 1; }

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Type check
        run: mypy src

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      # The browser tests run (and must not skip) on one version; elsewhere they skip.
      REQUIRE_BROWSER_TESTS: ${{ matrix.python == '3.12' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sqlmesh @ git+https://github.com/SQLMesh/sqlmesh@${SQLMESH_REF}"
          python -m pip install -e ".[dev]"

      - name: Install Chromium for the browser tests
        if: matrix.python == '3.12'
        run: python -m playwright install --with-deps chromium

      - name: Test
        run: pytest -q -p no:warnings
