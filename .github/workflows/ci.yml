name: ci

# Lint, types, and tests on every push and pull request, plus a DCO sign-off check on pull
# requests. SQLMesh is installed normally (not editable), so mypy sees its type hints, which an
# editable local checkout hides.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The execution-observation API is not in a SQLMesh release yet; pin a tested main commit
  # (the same one the docs and release workflows use).
  SQLMESH_REF: 3df452cc9f47a435439cda087c3a419a1778b2b9
  SQLMESH__DISABLE_ANONYMIZED_ANALYTICS: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from git history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sqlmesh @ git+https://github.com/SQLMesh/sqlmesh@${SQLMESH_REF}"
          python -m pip install -e ".[dev]"

      - name: Guard rails
        run: |
          ! grep -rn "set_console" src/ || { echo "src/ must not call set_console"; exit 1; }
          ! grep -rn "sqlmesh.materializations" src/ || { echo "src/ must not patch materializations"; exit 1; }

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Type check
        run: mypy src

      - name: Python 3.9 syntax
        run: |
          python - <<'EOF'
          import ast, pathlib
          for path in sorted(pathlib.Path("src").rglob("*.py")):
              ast.parse(path.read_text(), str(path), feature_version=(3, 9))
          EOF

      - name: Test
        run: pytest -q -p no:warnings

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by for $author"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s' (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "All commits are signed off."
