name: snowflake

# tests/test_snowflake.py on a real Snowflake account, weekly and on demand. Connection settings
# come from repository secrets (Settings > Secrets and variables > Actions); until
# SNOWFLAKE_ACCOUNT is set, the job only prints how to enable it.
on:
  schedule:
    - cron: "41 5 * * 1"  # Mondays, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snowflake
  cancel-in-progress: false

env:
  # Same pinned SQLMesh commit as ci.yml until the execution-observation API is released.
  SQLMESH_REF: 3df452cc9f47a435439cda087c3a419a1778b2b9
  SQLMESH__DISABLE_ANONYMIZED_ANALYTICS: "1"
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

jobs:
  snowflake:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for credentials
        id: creds
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then
            echo "::notice::Add SNOWFLAKE_* repository secrets to run the Snowflake test (see tests/test_snowflake.py)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sqlmesh[snowflake] @ git+https://github.com/SQLMesh/sqlmesh@${SQLMESH_REF}"
          python -m pip install -e ".[dev]"

      - name: Test on Snowflake
        if: steps.creds.outputs.ready == 'true'
        env:
          REQUIRE_SNOWFLAKE_TESTS: "1"
        run: pytest tests/test_snowflake.py -v -p no:warnings
