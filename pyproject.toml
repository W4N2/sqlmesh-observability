[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlmesh-observability"
dynamic = ["version"]
description = "Elementary-style data observability for SQLMesh projects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "W4N2" }]
keywords = ["sqlmesh", "data observability", "data quality", "anomaly detection", "lineage"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # TODO: pin to the first SQLMesh release that includes execution observations
    # (SQLMesh commit a8e3405f, after v0.236.4).
    "sqlmesh",
]

[project.optional-dependencies]
# `sqlmesh-observe serve`: the read-only ASGI app.
serve = [
    "starlette>=0.27",
    "uvicorn>=0.22",
]
# The documentation site (mkdocs.yml).
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
dev = [
    "httpx",  # Starlette's test client
    "mypy",
    "pytest",
    # Test-only: exercises the real `sqlmesh ui` code path (web.server).
    "sqlmesh[web]",
    "ruff",
    "starlette>=0.27",
    "uvicorn>=0.22",
    # Browser tests for the report renderer (tests/test_report_browser.py); 3.10+ only.
    "playwright>=1.49; python_version >= '3.10'",
    "pytest-playwright>=0.6; python_version >= '3.10'",
    # Snowflake's adapter over a mocked connection (tests/test_identifier_case.py).
    "snowflake-connector-python",
]

[project.urls]
Homepage = "https://w4n2.github.io/sqlmesh-observability/"
Documentation = "https://w4n2.github.io/sqlmesh-observability/"
Source = "https://github.com/W4N2/sqlmesh-observability"
Issues = "https://github.com/W4N2/sqlmesh-observability/issues"
Changelog = "https://github.com/W4N2/sqlmesh-observability/blob/main/CHANGELOG.md"

[project.scripts]
sqlmesh-observe = "sqlmesh_observability.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlmesh_observability = ["audits/*.sql", "web/*.js", "web/*.css", "py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100
extend-exclude = [".sqlmesh-main"]

[tool.ruff.lint]
select = ["E", "F", "I", "RET505", "T100"]
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["duckdb", "numpy", "pandas"]

[tool.mypy]
python_version = "3.9"
strict_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["snowflake: runs against a real Snowflake account (needs SNOWFLAKE_* variables)"]
